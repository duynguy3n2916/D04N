services:
  # Chạy cả backend trong Docker: docker compose --profile full up -d --build
  api:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
      - hf_cache:/root/.cache/huggingface
      - ../frontend:/frontend:ro

volumes:
  storage:
  hf_cache:
